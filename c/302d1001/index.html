    <title>Federico Ulfo</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b0d12;
            background-image: radial-gradient(ellipse at top, #1c2233 0%, #0b0d12 60%);
            color: #e7e9ee;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 20px;
            padding: 36px 28px 28px;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        .avatar {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.18);
            margin-bottom: 18px;
        }
        h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.02em; }
        .role { color: #9aa3b5; font-size: 0.95rem; margin-top: 6px; line-height: 1.5; }
        .save {
            display: block;
            margin: 26px 0 10px;
            padding: 14px 20px;
            border-radius: 12px;
            background: #64a19d;
            color: #0b0d12;
            font-weight: 800;
            font-size: 1rem;
            text-decoration: none;
            transition: filter 0.15s ease;
        }
        .save:hover { filter: brightness(1.1); }
        .links { margin-top: 18px; display: grid; gap: 10px; }
        .links a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #e7e9ee;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.15s ease;
        }
        .links a:hover { background: rgba(255, 255, 255, 0.10); }
        .links .icon { width: 22px; text-align: center; font-size: 1.05rem; }
        .links .label { flex: 1; text-align: left; }
        .footer { margin-top: 24px; color: #6b7385; font-size: 0.8rem; }
        .footer a { color: #9aa3b5; text-decoration: none; }
    </style>
</head>

<main class="card">
